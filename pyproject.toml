[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-logging-reproduction"
version = "0.1.0"
description = "Runnable reference reproduction of the Auto-Logging paper"
requires-python = ">=3.10"

[project.optional-dependencies]
api = ["flask>=2.2"]
cloud = [
  "flask>=2.2",
  "oss2",
  "alibabacloud-eas20210701",
  "alibabacloud-tea-openapi",
  "eas-prediction"
]
dev = ["pytest>=8"]

[project.scripts]
auto-logging = "autologging.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
